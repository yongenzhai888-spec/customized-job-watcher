[project]
name = "applepay-job-watcher"
version = "1.0.0"
description = "每日监测 Apple 招聘官网 Apple Pay 产品线在中国大陆的新增岗位，并把中文岗位解读发送到指定邮箱"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
applepay-watch = "applepay_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applepay_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
