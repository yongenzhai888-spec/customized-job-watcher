[project]
name = "job-watcher"
version = "2.0.0"
description = "每日监测 Apple / 阿里国际 / 字节跳动招聘官网的新增岗位，并把岗位职责与要求邮件发给你"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobwatch = "jobwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwatch"]

[tool.ruff]
# 放宽到 110：正文里有大量中文字符串和内联样式的 HTML 模板，
# 强行折行反而更难读。
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
